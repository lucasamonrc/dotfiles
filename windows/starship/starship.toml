"$schema" = "https://starship.rs/config-schema.json"

# Equivalent to SPACESHIP_PROMPT_ADD_NEWLINE=false
add_newline = false

# Similar to your Spaceship prompt order:
# user  dir  host  git  exec_time
# newline  jobs  exit_code  char
format = """
$username$directory$hostname$git_branch$git_status$cmd_duration
$jobs$status$character"""

[username]
show_always = true
format = "[$user]($style) "
style_user = "bold cyan"
style_root = "bold red"

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold blue"
truncation_length = 3
truncate_to_repo = false

[hostname]
ssh_only = false
format = "on [$hostname]($style) "
style = "bold purple"

[git_branch]
format = "on [$symbol$branch]($style) "
symbol = "❯ "
style = "bold green"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold red"

[cmd_duration]
min_time = 0
show_milliseconds = true
format = "took [$duration]($style) "
style = "yellow"

[jobs]
format = "[$symbol$number]($style) "
symbol = "❯ "
style = "bold blue"
symbol_threshold = 1
number_threshold = 2

[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "❯ "
style = "bold red"

[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
